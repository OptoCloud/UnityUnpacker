name: Set up build
description: Rust toolchain, wxWidgets build dependencies, and cargo/target caching.

inputs:
  cache-key:
    description: Extra component for the cache key (e.g. the workflow name).
    required: true

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --component clippy,rustfmt
        rustup default stable
        echo "RUSTC_VERSION=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_ENV"

    - name: Install wxWidgets build dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ninja-build cmake libclang-dev pkg-config libgtk-3-dev libpng-dev libjpeg-dev \
          libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libexpat1-dev libtiff-dev \
          libasound2-dev

    - name: Install Ninja (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: choco install ninja -y --no-progress

    # target/ holds the compiled wxWidgets, which is most of the build time.
    - name: Cache cargo registry and target
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-${{ inputs.cache-key }}-rust-${{ env.RUSTC_VERSION }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-key }}-rust-${{ env.RUSTC_VERSION }}-
